<div class="register-container">

  <div class="register-card">

    <h1>⚔️ Quiz Battle Arena</h1>

    <h2>Create Your Account</h2>

    <p>Join the battle and test your knowledge!</p>

    <form (ngSubmit)="register()">

      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Username"
        required
      />

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Email"
        required
      />

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Password"
        required
      />

      <button type="submit">
        Create Account
      </button>

    </form>

    <p class="login-text">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</div>
