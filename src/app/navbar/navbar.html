<nav class="navbar">

  <div class="brand">
    <span class="brand-icon">⚔️</span>
    <span class="brand-name">Quiz Battle Arena</span>
  </div>

  <div class="navbar-links">

    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      🏠 Home
    </a>

    <a
      routerLink="/battle"
      routerLinkActive="active">
      ⚔️ Battle
    </a>

    <a
      routerLink="/leaderboard"
      routerLinkActive="active">
      🏆 Leaderboard
    </a>

    <a
      routerLink="/history"
      routerLinkActive="active">
      📜 History
    </a>

  </div>

  @if (isLoggedIn()) {

    <button
      type="button"
      class="login-button logout-button"
      (click)="logout()">
      🚪 Logout
    </button>

  } @else {

    <a
      routerLink="/login"
      class="login-button">
      Login / Register
    </a>

  }

</nav>
